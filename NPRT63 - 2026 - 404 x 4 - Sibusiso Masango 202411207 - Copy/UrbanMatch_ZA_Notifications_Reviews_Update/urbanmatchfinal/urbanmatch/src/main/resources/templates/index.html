<style>
:root {
  --ink: #0F172A; --ink-2: #1E293B; --ink-3: #334155;

  --bg: #F8FAFC; --bg-2: #F1F5F9;
  --brand: #4F46E5; --brand-2: #6366F1; --brand-soft: #EEF2FF;
  --coral: #F43F5E; --coral-soft: #FFF1F2;
  --teal: #14B8A6; --teal-soft: #CCFBF1;
  --amber: #F59E0B; --amber-soft: #FEF3C7;
  --emerald: #10B981; --emerald-soft: #D1FAE5;
  --violet: #8B5CF6;
  --grad-1: linear-gradient(135deg, #4F46E5 0%, #8B5CF6 50%, #EC4899 100%);
  --grad-2: linear-gradient(135deg, #0EA5E9 0%, #6366F1 100%);
  --grad-3: linear-gradient(135deg, #F43F5E 0%, #F59E0B 100%);

  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10);
  --shadow-xl: 0 24px 48px rgba(15, 23, 42, 0.14);
  --r: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;

}

/* =========================================================
   UTILITIES
   ========================================================= */
const Utils = {
  uid: () => 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
  escape: (s) => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])),
  initials: (name) => name ? name.split(/\s+/).map(p => p[0]).slice(0,2).join('').toUpperCase() : '?',
  formatMoney: (amount, freq) => {
    const a = Number(amount) || 0;
    const f = { hourly: 'per hour', daily: 'per day', weekly: 'per week', monthly: 'per month', project: 'per project' }[freq] || '';
    return `R ${a.toLocaleString('en-ZA')} ${f}`.trim();
  },
  formatDate: (iso) => { try { return new Date(iso).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' }); } catch { return iso || ''; } },
  formatDateTime: (iso) => {
    if (!iso) return '';
    try {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
      return new Date(iso).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' });
    } catch { return ''; }
  },
  daysAgo: (iso) => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : 0,
  truncate: (s, n=140) => !s ? '' : (s.length > n ? s.slice(0, n).trim() + '…' : s),
  starsHTML: (rating, max=5) => {
    let html = '<span class="stars">';
    for (let i=1; i<=max; i++) html += i <= Math.round(rating) ? Icon.star(14) : `<span class="star-off">${Icon.star(14)}</span>`;
    return html + '</span>';
  },
  validateEmail: (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e),
  debounce: (fn, wait=250) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); }; }
};

const DB_KEY = 'urbanmatch_za_db_v4';
const DB = {

  load() {
    if (this._cache) return this._cache;
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        this._cache = JSON.parse(raw);
        ['users','jobs','applications','messages','conversations','notifications','savedJobs','reviews','reports','session'].forEach(k => { if (!this._cache[k]) this._cache[k] = (k==='session'? null : []); });
        return this._cache;
      }
    } catch (e) {}
    this._cache = this.seed();
    this.save();
    return this._cache;
  },

  reset() { localStorage.removeItem(DB_KEY); this._cache = null; return this.load(); },

  getUserById(id) { return this.load().users.find(u => u.id === id); },

  createUser(data) {

  getJobs(filters={}) {
    let jobs = this.load().jobs.slice();
    if (filters.employerId) jobs = jobs.filter(j => j.employerId === filters.employerId);
    if (filters.status) jobs = jobs.filter(j => j.status === filters.status);
    if (filters.category) jobs = jobs.filter(j => j.category === filters.category);
    if (filters.employmentType) jobs = jobs.filter(j => j.employmentType === filters.employmentType);
    if (filters.location) jobs = jobs.filter(j => (j.location||'').toLowerCase().includes(filters.location.toLowerCase()));
    if (filters.q) { const q = filters.q.toLowerCase(); jobs = jobs.filter(j => (j.title||'').toLowerCase().includes(q) || (j.description||'').toLowerCase().includes(q) || (j.skills||[]).some(s => s.toLowerCase().includes(q))); }
    if (filters.minPay) jobs = jobs.filter(j => Number(j.salaryAmount) >= Number(filters.minPay));
    if (filters.maxPay) jobs = jobs.filter(j => Number(j.salaryAmount) <= Number(filters.maxPay));
    if (filters.noQuals) jobs = jobs.filter(j => !(j.qualificationRequirements && j.qualificationRequirements.length));
    if (filters.newOnly) jobs = jobs.filter(j => Utils.daysAgo(j.createdAt) <= 7);
    if (filters.sort === 'newest') jobs.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (filters.sort === 'payHigh') jobs.sort((a,b) => Number(b.salaryAmount) - Number(a.salaryAmount));
    if (filters.sort === 'payLow') jobs.sort((a,b) => Number(a.salaryAmount) - Number(b.salaryAmount));

/* Live API bridge: database is the source of truth; no demo accounts are loaded. */
const Live = {
  credentials: null,
  async request(path, method='GET', data) {
    const headers = {};
    if (this.credentials) headers.Authorization = 'Basic ' + btoa(unescape(encodeURIComponent(this.credentials.email + ':' + this.credentials.password)));
    if (data !== undefined) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, {method, headers, body: data === undefined ? undefined : JSON.stringify(data), cache:'no-store'});
    if (!response.ok) {
      let detail = ''; try { const j=await response.json(); detail=j.detail||j.message||j.error||''; } catch {}
      throw new Error(detail || `Server returned ${response.status}`);
    }
    if (response.status === 204 || response.headers.get('content-length') === '0') return null;
    const txt = await response.text(); return txt ? JSON.parse(txt) : null;
  },
  user(u) {
    const name = u.fullName || u.full_name || '';
    const parts = name.trim().split(/\s+/);
    return {id:String(u.id),firstName:parts[0]||'',lastName:parts.slice(1).join(' '),email:u.email||'',role:u.role,status:u.status||'active',phone:u.phone||'',location:u.location||'Kimberley',companyName:u.companyName||u.company_name||'',companyDescription:u.companyDescription||u.company_description||'',industry:u.industry||'',skills:[],experience:[],education:[]};
  },
  job(j) { return {id:String(j.id),employerId:String(j.employerId||j.employer_id),title:j.title,description:j.description,category:j.category||'',location:j.location||'',employmentType:j.employmentType||j.employment_type||'',salaryAmount:Number(j.salaryMin??j.salary_min??0),salaryFrequency:j.salaryFrequency||j.salary_frequency||'monthly',skills:String(j.skills||'').split(',').map(x=>x.trim()).filter(Boolean),qualificationRequirements:j.requirements||'',experienceRequirements:'',positions:1,deadline:'',status:j.status==='open'?'active':j.status,createdAt:j.createdAt||j.created_at||new Date().toISOString()}; },
  application(a) { const job=DB.getJobById(String(a.jobId));return {id:String(a.id),jobId:String(a.jobId),jobSeekerId:String(a.seekerId),employerId:job?.employerId||'',coverMessage:a.coverMessage||'',cvFilename:a.cvFilename||'',status:({pending:'Submitted',reviewed:'Under Review',shortlisted:'Shortlisted',accepted:'Accepted',rejected:'Rejected',withdrawn:'Withdrawn'})[a.status]||a.status,submittedAt:a.appliedAt||new Date().toISOString(),updatedAt:a.updatedAt||a.appliedAt||new Date().toISOString()}; },
  async refresh() {
    const db=DB.load();
    const [jobs,directory,allReviews]=await Promise.all([this.request('/api/jobs/open'),this.request('/api/directory'),this.request('/api/reviews')]);
    db.users=(directory||[]).map(x=>this.user(x));
    db.jobs=(jobs||[]).map(x=>this.job(x));
    db.applications=[];db.savedJobs=[];db.messages=[];db.conversations=[];db.notifications=[];db.reviews=(allReviews||[]).map(r=>({id:String(r.id),reviewerId:String(r.reviewer_id),revieweeId:String(r.reviewee_id),rating:Number(r.rating),comment:r.comment||'',createdAt:r.created_at,relatedJobId:null}));db.reports=[];
    if (!this.credentials) {db.session=null;return;}
    const me=this.user(await this.request('/api/auth/me'));
    db.users=db.users.filter(u=>u.id!==me.id).concat(me);db.session=me.id;
    const optional=async(path)=>{try{return await this.request(path)||[]}catch(e){console.warn(path,e.message);return [];}};
    const tasks=[optional('/api/jobs/mine'),optional('/api/applications/mine'),optional('/api/saved-jobs'),optional('/api/conversations'),optional('/api/notifications'),optional('/api/employer/profile')];
    const [mine,apps,saved,convs,notifs,employer]=await Promise.all(tasks);
    for(const j of mine) {const item=this.job(j);db.jobs=db.jobs.filter(x=>x.id!==item.id);db.jobs.push(item);}
    db.applications=apps.map(x=>this.application(x));
    db.savedJobs=saved.map(x=>({id:String(x.id),userId:me.id,jobId:String(x.job_id),savedAt:x.saved_at}));
    db.conversations=convs.map(x=>({id:String(x.id),participantIds:[String(x.seeker_id),String(x.employer_id)],relatedJobId:x.job_id?String(x.job_id):null,lastMessageAt:x.updated_at}));
    db.notifications=notifs.map(x=>({id:String(x.id),userId:me.id,title:x.title||'',message:x.message||'',type:x.notification_type||'info',read:!!x.is_read,createdAt:x.created_at,relatedEntityId:x.related_id?String(x.related_id):null,relatedEntityType:x.notification_type}));
    if(employer.length){Object.assign(me,{companyName:employer[0].company_name||'',companyDescription:employer[0].company_description||'',industry:employer[0].industry||''});}
    if(me.role==='admin') {
      const [users,allJobs,reports]=await Promise.all([optional('/api/admin/users'),optional('/api/admin/jobs'),optional('/api/admin/reports')]);
      db.users=users.map(x=>this.user(x));
      db.jobs=allJobs.map(x=>this.job(x));
      db.reports=reports.map(x=>({id:String(x.id),reporterId:String(x.reporter_id),targetType:x.reported_job_id?'job':'user',targetId:String(x.reported_job_id||x.reported_user_id),reason:x.reason,description:x.description,status:x.status,createdAt:x.created_at}));
    }
    const perJob=me.role==='employer'?mine:[];
    if(perJob.length){const all=await Promise.all(perJob.map(j=>optional('/api/applications/job/'+j.id)));db.applications=all.flat().map(x=>this.application(x));}
    const allMessages=await Promise.all(db.conversations.map(c=>optional('/api/conversations/'+c.id+'/messages')));
    db.messages=allMessages.flat().map(m=>({id:String(m.id),conversationId:String(m.conversation_id),senderId:String(m.sender_id),messageText:m.message_text,readStatus:!!m.is_read,sentAt:m.sent_at}));
  },
  async change(path,method,data){const result=await this.request(path,method,data);await this.refresh();return result;},
  async login(email,password){this.credentials={email,password};try{await this.refresh();return {ok:true,user:DB.currentUser()};}catch(e){this.credentials=null;DB.load().session=null;return {ok:false,error:e.message};}},
  async register(d){if(d.password!==d.confirmPassword) return {ok:false,error:'Passwords do not match'};if(!d.acceptTerms)return {ok:false,error:'Accept the terms'};try{await this.request('/api/auth/register','POST',{fullName:(d.firstName+' '+d.lastName).trim(),email:d.email,password:d.password,role:d.role,phone:d.phone,location:d.location});return await this.login(d.email,d.password);}catch(e){return {ok:false,error:e.message};}},
  logout(){this.credentials=null;const d=DB.load();d.session=null;d.applications=[];d.savedJobs=[];d.conversations=[];d.messages=[];d.notifications=[];d.reports=[];},
  jobRequest(d){return {title:d.title,description:d.description,category:d.category,location:d.location,employmentType:d.employmentType,salaryMin:Number(d.salaryAmount),salaryMax:Number(d.salaryAmount),salaryFrequency:d.salaryFrequency,requirements:[d.qualificationRequirements,d.experienceRequirements].filter(Boolean).join(' | '),skills:(d.skills||[]).join(', ')};},
  async start(){try{await this.refresh();}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="container" style="padding:50px">Cannot connect to the UrbanMatch API. Start Spring Boot and reload. '+Utils.escape(e.message)+'</div>';return;}Router.render();}
};
// Disable browser demo persistence. Keep the existing synchronous render helpers.
DB._cache={users:[],jobs:[],applications:[],messages:[],conversations:[],notifications:[],savedJobs:[],reviews:[],reports:[],session:null};
DB.save=()=>{}; DB.reset=()=>{throw Error('Demo reset is unavailable on the live database');};
DB.createJob=(d)=>Live.change('/api/jobs','POST',Live.jobRequest(d));
DB.updateJob=(id,d)=>d.status?Live.change('/api/jobs/'+id+'/status?value='+(d.status==='active'?'open':'closed'),'PATCH'):Live.change('/api/jobs/'+id,'PUT',Live.jobRequest(d));
DB.deleteJob=id=>Live.change('/api/jobs/'+id,'DELETE');
DB.submitApplication=d=>Live.change('/api/applications','POST',{jobId:Number(d.jobId),coverMessage:d.coverMessage});
DB.updateApplicationStatus=(id,status)=>Live.change('/api/applications/'+id+'/status?value='+encodeURIComponent(({Submitted:'pending','Under Review':'reviewed',Shortlisted:'shortlisted',Accepted:'accepted',Rejected:'rejected'})[status]||status.toLowerCase()),'PATCH');
DB.saveJob=(uid,jid)=>Live.change('/api/saved-jobs/'+jid,'POST');
DB.unsaveJob=(uid,jid)=>Live.change('/api/saved-jobs/'+jid,'DELETE');
DB.createReview=d=>Live.change('/api/reviews','POST',{revieweeId:Number(d.revieweeId),rating:d.rating,comment:d.comment});
DB.createReport=d=>Live.change('/api/reports','POST',{reportedUserId:d.targetType==='job'?null:Number(d.targetId),reportedJobId:d.targetType==='job'?Number(d.targetId):null,reason:d.reason,description:d.description});
DB.updateReportStatus=(id,status)=>Live.change('/api/admin/reports/'+id+'?status='+status.toLowerCase(),'PATCH');
DB.updateUser=(id,d)=>{const u=DB.currentUser();if(u?.id!==String(id)){if(u?.role==='admin'&&d.status)return Live.change('/api/admin/users/'+id+'/status?status='+d.status,'PATCH');throw Error('Cannot edit another account');}return Live.change('/api/profile','PATCH',{fullName:((d.firstName||u.firstName)+' '+(d.lastName||u.lastName)).trim(),phone:d.phone??u.phone,location:d.location??u.location});};
DB.createNotification=()=>{}; // notifications must be emitted by the server, not forged by browsers
DB.markNotificationRead=id=>Live.change('/api/notifications/'+id+'/read','PATCH');
DB.markAllNotificationsRead=async()=>{for(const n of DB.load().notifications.filter(n=>!n.read))await Live.request('/api/notifications/'+n.id+'/read','PATCH');await Live.refresh();};
DB.getOrCreateConversation=async(p1,p2,jobId)=>{const a=DB.currentUser();await Live.change('/api/conversations','POST',{seekerId:Number(a.role==='seeker'?p1:p2),employerId:Number(a.role==='employer'?p1:p2),jobId:jobId?Number(jobId):null});return DB.getConversations(a.id).find(c=>c.participantIds.includes(String(p2))&&(jobId?c.relatedJobId===String(jobId):!c.relatedJobId));};
DB.sendMessage=d=>Live.change('/api/conversations/'+d.conversationId+'/messages','POST',{message:d.messageText});
DB.markConversationRead=id=>Live.change('/api/conversations/'+id+'/read','PATCH');

const Router = {
  current: 'landing', params: {},
  go(view, params={}) { this.current = view; this.params = params; window.scrollTo({ top: 0, behavior: 'instant' }); this.render(); },
  render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    renderTopNav();
    try {
      switch (this.current) {
        case 'landing': renderLanding(app); break;
        case 'login': renderLogin(app); break;
        case 'register': renderRegister(app); break;
        case 'dashboard': renderDashboard(app); break;
        case 'find-jobs': renderFindJobs(app); break;
        case 'job-detail': renderJobDetail(app); break;
        case 'create-job': renderCreateJob(app); break;
        case 'edit-job': renderEditJob(app); break;
        case 'my-applications': renderMyApplications(app); break;
        case 'saved-jobs': renderSavedJobs(app); break;
        case 'profile': renderProfile(app); break;
        case 'employer-profile': renderEmployerProfile(app); break;
        case 'messages': renderMessages(app); break;
        case 'notifications': renderNotifications(app); break;
        case 'edit-profile': renderEditProfile(app); break;
        case 'application-detail': renderApplicationDetail(app); break;
        case 'manage-listings': renderManageListings(app); break;
        case 'applicant-management': renderApplicantManagement(app); break;
        case 'reports': renderReports(app); break;
        case 'settings': renderSettings(app); break;
        case 'admin-users': renderAdminUsers(app); break;
        case 'admin-jobs': renderAdminJobs(app); break;
        default: renderLanding(app);
      }
    } catch (err) {
      console.error('Render error:', err);
      app.innerHTML = `<div class="container" style="padding:60px 24px;text-align:center"><div class="card"><h2>Something went wrong</h2><p class="text-muted">We encountered an error loading this page.</p><button class="btn btn-primary mt-16" data-action="go" data-view="landing">Go Home</button></div></div>`;
    }
  }
};

function avatarHTML(user, size='') {
  const cls = 'avatar' + (size ? ' ' + size : '');
  if (!user) return `<div class="${cls}">?</div>`;
  const src = user.profilePicture || user.companyLogo;
  if (src) return `<div class="${cls}"><img src="${Utils.escape(src)}" alt="" onerror="this.parentNode.innerHTML='${Utils.initials(user.firstName+' '+user.lastName)}'"/></div>`;
  return `<div class="${cls}">${Utils.initials(user.firstName+' '+user.lastName)}</div>`;
}

function statusBadgeClass(status) {
  return { 'Submitted': 'brand', 'Under Review': 'amber', 'Shortlisted': 'violet', 'Accepted': 'emerald', 'Rejected': 'coral', 'Withdrawn': 'outline' }[status] || 'outline';
}
function reportStatusClass(status) {
  return { 'Open': 'coral', 'Under Review': 'amber', 'Resolved': 'emerald', 'Dismissed': 'outline' }[status] || 'outline';
}
function emptyStateHTML(title, msg) {
  return `<div class="empty-state"><div class="empty-state-icon">${Icon.sparkles(28)}</div><h4>${title}</h4><p>${msg}</p></div>`;
}
function profileCompletion(user) {
  if (!user) return 0;
  const fields = ['headline','bio','location','phone'];
  let done = fields.filter(f => user[f] && user[f].toString().trim().length > 0).length;
  if (user.skills && user.skills.length) done++;
  if (user.experience && user.experience.length) done++;
  if (user.education && user.education.length) done++;
  if (user.profilePicture) done++;
  return Math.round((done / (fields.length + 4)) * 100);
}

function jobCardHTML(j) {
  try {
    const employer = DB.getUserById(j.employerId);
    const empName = employer ? (employer.companyName || (employer.firstName + ' ' + employer.lastName)) : 'Employer';
    const logoInitial = empName.charAt(0).toUpperCase();
    const user = DB.currentUser();
    const isSaved = user ? DB.isJobSaved(user.id, j.id) : false;
    const coverImg = Img.jobCover[j.category] || Img.jobCover.default;
    return `
      <div class="job-card" data-action="view-job" data-id="${j.id}">
        <div class="job-card-cover" style="background-image:url('${coverImg}')">
          <div class="job-card-type">${Utils.escape(j.employmentType)}</div>

function renderJobDetail(root) {
  try {
    const jobId = Router.params.id;
    if (!jobId) { root.innerHTML = `<div class="container" style="padding:40px"><div class="card"><h2>Job not found</h2><p>No job ID provided.</p><button class="btn btn-primary" data-action="go" data-view="find-jobs">Browse jobs</button></div></div>`; return; }
    const job = DB.getJobById(jobId);
    if (!job) { root.innerHTML = `<div class="container" style="padding:40px"><div class="card"><h2>Job not found</h2><p>This job may have been removed or is no longer available.</p><button class="btn btn-primary" data-action="go" data-view="find-jobs">Browse jobs</button></div></div>`; return; }
    const employer = DB.getUserById(job.employerId);
    const user = DB.currentUser();
    const isSaved = user ? DB.isJobSaved(user.id, job.id) : false;
    const applications = user ? DB.getApplications({ jobId: job.id, jobSeekerId: user.id }) : [];
    const myApplication = applications && applications.length > 0 ? applications[0] : null;
    const avgRating = employer ? DB.getAverageRating(employer.id) : 0;
    const reviewCount = employer ? DB.getReviews({ revieweeId: employer.id }).length : 0;
    const coverImg = Img.jobCover[job.category] || Img.jobCover.default;

    let actionButtons = '';
    if (user && user.role === 'seeker') {
      if (myApplication) {
        actionButtons = `<div class="text-center"><div class="mb-12"><span class="badge ${statusBadgeClass(myApplication.status)}" style="font-size:13px;padding:6px 14px">Application: ${Utils.escape(myApplication.status)}</span></div><button class="btn btn-outline btn-block btn-sm" data-action="view-application" data-id="${myApplication.id}">View my application</button>${myApplication.status === 'Submitted' ? `<button class="btn btn-ghost btn-block btn-sm mt-8" data-action="withdraw-application" data-id="${myApplication.id}">Withdraw</button>` : ''}</div>`;
      } else if (job.status === 'active') {
        actionButtons = `<button class="btn btn-brand btn-block" data-action="apply-job" data-id="${job.id}">${Icon.send(16)} Apply now</button><button class="btn btn-outline btn-block mt-8" data-action="toggle-save-job" data-id="${job.id}">${Icon.bookmark(14, isSaved)} ${isSaved ? 'Saved' : 'Save job'}</button>`;
      } else {
        actionButtons = `<button class="btn btn-outline btn-block" disabled>Closed</button>`;
      }
    } else if (user && user.role === 'employer' && job.employerId === user.id) {
      actionButtons = `<button class="btn btn-outline btn-block btn-sm" data-action="edit-job" data-id="${job.id}">${Icon.edit(14)} Edit listing</button><button class="btn btn-outline btn-block btn-sm mt-8" data-action="view-applicants-for-job" data-id="${job.id}">${Icon.users(14)} View applicants</button>`;
    } else {
      actionButtons = `<button class="btn btn-brand btn-block" data-action="go" data-view="register">${Icon.zap(16)} Sign in to apply</button><button class="btn btn-outline btn-block mt-8" data-action="toggle-save-job" data-id="${job.id}">${Icon.bookmark(14, isSaved)} ${isSaved ? 'Saved' : 'Save job'}</button>`;
    }

    const empName = employer ? (employer.companyName || (employer.firstName + ' ' + employer.lastName)) : 'Employer';

ine : '')}" /></div></div><div class="form-group"><label class="form-label" for="j-contact">Contact preferences</label><textarea class="form-textarea" id="j-contact" name="contactPreferences" rows="2">${Utils.escape(job ? job.contactPreferences : '')}</textarea></div><div class="flex gap-8 justify-between mt-20"><button type="button" class="btn btn-ghost" data-action="go" data-view="manage-listings">Cancel</button><div class="flex gap-8"><button type="button" class="btn btn-outline" data-action="preview-job">${Icon.search(14)} Preview</button><button type="submit" class="btn btn-brand">${isEdit ? Icon.check(14) + ' Save changes' : Icon.zap(14) + ' Publish job'}</button></div></div></form></div></div>`;

let activeConversationId = null;
function renderMessages(root) {
  const user = Auth.requireRole('seeker','employer','admin'); if (!user) return;
  const conversations = DB.getConversations(user.id);
  if (!activeConversationId && conversations.length) activeConversationId = conversations[0].id;
  root.innerHTML = `<div class="container" style="padding-top:24px"><div class="flex items-center gap-12 mb-20"><div style="width:44px;height:44px;border-radius:14px;background:var(--grad-2);color:#fff;display:flex;align-items:center;justify-content:center">${Icon.message(20)}</div><div><h2 style="margin:0;font-size:22px">Messages</h2><p class="text-muted text-sm" style="margin:0">Conversations with employers and applicants.</p></div></div><div class="msg-layout"><div class="msg-list"><div class="msg-list-head"><input type="text" id="conv-search" placeholder="Search conversations..." /></div><div id="conv-list">${conversations.length ? conversations.map(c => convItemHTML(c, user.id)).join('') : `<div class="empty-state" style="padding:40px 20px"><div class="empty-state-icon">${Icon.message(28)}</div><h4>No conversations</h4><p>Start a conversation from a job or profile.</p></div>`}</div></div><div class="msg-thread" id="msg-thread">${activeConversationId ? threadHTML(activeConversationId, user.id) : `<div class="empty-state" style="padding:40px"><div class="empty-state-icon">${Icon.message(28)}</div><h4>Select a conversation</h4></div>`}</div></div></div>`;
  if (activeConversationId) DB.markConversationRead(activeConversationId, user.id);
  renderTopNav();
}
function convItemHTML(c, userId) {
  const otherId = c.participantIds.find(p => p !== userId);
  const other = DB.getUserById(otherId);
  if (!other) return '';
  const msgs = DB.getMessages(c.id);
  const last = msgs[msgs.length-1];
  const unread = msgs.some(m => m.receiverId === userId && !m.readStatus);
  return `<div class="conv-item ${c.id===activeConversationId?'active':''}" data-action="open-conversation" data-id="${c.id}">${avatarHTML(other, '')}<div class="conv-info"><div class="conv-name"><span>${Utils.escape(other.firstName + ' ' + other.lastName)}</span><span class="conv-time">${last ? Utils.formatDateTime(last.sentAt) : ''}</span></div><div class="conv-preview">${last ? Utils.escape(Utils.truncate(last.messageText, 60)) : 'No messages yet'}</div></div>${unread ? '<span class="unread-dot"></span>' : ''}</div>`;
}
function threadHTML(convId, userId) {
  const c = DB.load().conversations.find(x => x.id === convId);
  if (!c) return `<div class="empty-state"><h4>Conversation not found</h4></div>`;
  const otherId = c.participantIds.find(p => p !== userId);
  const other = DB.getUserById(otherId);
  const msgs = DB.getMessages(convId);
  const job = c.relatedJobId ? DB.getJobById(c.relatedJobId) : null;
  return `<div class="msg-thread-head">${avatarHTML(other, '')}<div style="flex:1"><div class="text-strong">${Utils.escape(other ? other.firstName + ' ' + other.lastName : 'Unknown')}</div>${job ? `<div class="text-xs text-muted">Re: ${Utils.escape(job.title)}</div>` : ''}</div></div><div class="msg-thread-body" id="msg-body">${msgs.length ? msgs.map(m => `<div class="msg-bubble ${m.senderId === userId ? 'sent' : 'received'}"><div>${Utils.escape(m.messageText)}</div><div class="msg-time">${Utils.formatDateTime(m.sentAt)}</div></div>`).join('') : `<div class="empty-state" style="padding:30px"><div class="empty-state-icon">${Icon.message(28)}</div><p>No messages yet. Say hello!</p></div>`}</div><form class="msg-input-row" data-form="send-message"><input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required /><button type="submit" class="btn btn-brand">${Icon.send(16)}</button></form>`;
}

function renderNotifications(root) {

/* =========================================================
   MODALS & TOASTS
   ========================================================= */
function toast(title, msg, type='success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const iconMap = { success: Icon.check(16), error: Icon.x(16), info: Icon.bell(16), warn: Icon.alert(16) };
  el.innerHTML = `<div class="toast-icon">${iconMap[type] || iconMap.info}</div><div style="flex:1"><div class="toast-title">${Utils.escape(title)}</div><div class="toast-msg">${Utils.escape(msg)}</div></div>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all 220ms'; }, 3200);
  setTimeout(() => el.remove(), 3500);
}

function confirmDialog(title, message, onConfirm, confirmText='Confirm', danger=false) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h3 id="modal-title">${Utils.escape(title)}</h3><button class="close-btn" data-action="close-modal" aria-label="Close">${Icon.x(16)}</button></div><div class="modal-body"><p style="margin:0;color:var(--ink-3);line-height:1.6">${Utils.escape(message)}</p></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn ${danger?'btn-danger':'btn-brand'}" id="modal-confirm">${Utils.escape(confirmText)}</button></div></div></div>`;
  document.getElementById('modal-confirm').onclick = () => { closeModal(); onConfirm(); };
}

function openModal(html) { document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-action="close-modal-bg">${html}</div>`; }
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openApplyModal(jobId) {
  const user = DB.currentUser();
  if (!user || user.role !== 'seeker') { toast('Sign in required', 'Please sign in as a job seeker to apply.', 'info'); Router.go('login'); return; }
  const job = DB.getJobById(jobId);
  if (!job) return;
  const existing = DB.getApplications({ jobId, jobSeekerId: user.id })[0];
  if (existing) { toast('Already applied', 'You have already applied for this job.', 'warn'); return; }
  const employer = DB.getUserById(job.employerId);
  const empName = employer ? (employer.companyName || (employer.firstName + ' ' + employer.lastName)) : 'Employer';
  const empInitial = empName.charAt(0);
  openModal(`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>Apply for ${Utils.escape(job.title)}</h3><button class="close-btn" data-action="close-modal" aria-label="Close">${Icon.x(16)}</button></div><div class="modal-body"><div style="padding:12px;background:var(--bg);border-radius:var(--r);margin-bottom:16px;display:flex;gap:12px;align-items:center"><div class="job-employer-logo" style="width:44px;height:44px">${employer && employer.companyLogo ? `<img src="${Utils.escape(employer.companyLogo)}" alt="" onerror="this.parentNode.textContent='${empInitial}'"/>` : empInitial}</div><div><div class="text-strong">${Utils.escape(empName)}</div><div class="text-muted text-xs">${Icon.mapPin(10)} ${Utils.escape(job.location)}</div></div></div><form data-form="apply"><div class="form-group"><label class="form-label">Cover message</label><textarea class="form-textarea" name="coverMessage" rows="4" placeholder="Tell the employer why you are a good fit..."></textarea></div><div class="form-group"><label class="form-label">CV or supporting document</label><input type="file" name="cv" id="apply-cv" accept=".pdf,.doc,.docx,image/*" /><div class="form-hint" id="apply-cv-name">PDF, DOC or image. Max 5MB.</div></div><div class="form-error" data-error="general"></div></form></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-brand" id="apply-submit">${Icon.send(14)} Submit application</button></div></div>`);
  document.getElementById('apply-cv').addEventListener('change', (e) => {
    const f = e.target.files[0];
    const nameEl = document.getElementById('apply-cv-name');
    if (!f) { nameEl.textContent = 'PDF, DOC or image. Max 5MB.'; return; }
    if (f.size > 5 * 1024 * 1024) { toast('File too large', 'Please choose a file under 5MB.', 'error'); e.target.value = ''; nameEl.textContent = 'PDF, DOC or image. Max 5MB.'; return; }
    nameEl.textContent = 'Selected: ' + f.name;
  });
  document.getElementById('apply-submit').onclick = async () => {
    const form = document.querySelector('[data-form="apply"]');
    const cover = form.coverMessage.value.trim();
    const cv = form.cv.files[0];
    if(cv){toast('CV upload unavailable','The backend does not support CV file uploads yet. Please submit without a file.','error');return;}
    if (!cover) { form.querySelector('[data-error="general"]').textContent = 'Please add a short cover message.'; form.querySelector('[data-error="general"]').classList.add('show'); return; }
    const btn = document.getElementById('apply-submit');
    btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const app = await DB.submitApplication({ jobId, jobSeekerId: user.id, employerId: job.employerId, coverMessage: cover, cvFilename: cv ? cv.name : '' });
      DB.createNotification({ userId: job.employerId, title: 'New application', message: `${user.firstName} ${user.lastName} applied for ${job.title}.`, type: 'application', relatedEntityId: app.id, relatedEntityType: 'application' });
      DB.createNotification({ userId: user.id, title: 'Application submitted', message: `Your application for ${job.title} has been sent.`, type: 'application', relatedEntityId: app.id, relatedEntityType: 'application' });
      closeModal();
      toast('Application submitted', 'Your application was saved to MySQL.', 'success');
      Router.render();
    } catch(err){toast('Application failed',err.message,'error');btn.disabled=false;btn.textContent='Submit application';}
  };
}

function openReviewModal(revieweeId, jobId) {
  const user = DB.currentUser(); if (!user) return;
  const existing = DB.getReviews({ revieweeId }).find(r => r.reviewerId === user.id);
  if (existing) { toast('Already reviewed', 'You have already left a review for this engagement.', 'warn'); return; }
  openModal(`<div class="modal"><div class="modal-head"><h3>${Icon.star(16)} Leave a review</h3><button class="close-btn" data-action="close-modal">${Icon.x(16)}</button></div><div class="modal-body"><form data-form="review"><div class="form-group"><label class="form-label">Rating</label><select class="form-select" name="rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Average</option><option value="2">★★ Below average</option><option value="1">★ Poor</option></select></div><div class="form-group"><label class="form-label">Comment</label><textarea class="form-textarea" name="comment" rows="3" placeholder="Share your experience..."></textarea></div></form></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-brand" id="review-submit">${Icon.check(14)} Submit review</button></div></div>`);
  document.getElementById('review-submit').onclick = async () => {
    const form = document.querySelector('[data-form="review"]');
    await DB.createReview({ reviewerId: user.id, revieweeId, relatedJobId: jobId || null, rating: Number(form.rating.value), comment: form.comment.value.trim() });
    closeModal(); toast('Thank you', 'Your review has been submitted.', 'success'); Router.render();
  };
}

function openReportModal(targetType, targetId) {
  const user = DB.currentUser();
  if (!user) { toast('Sign in required', 'Please sign in to submit a report.', 'info'); Router.go('login'); return; }
  openModal(`<div class="modal"><div class="modal-head"><h3>${Icon.flag(16)} Report ${targetType}</h3><button class="close-btn" data-action="close-modal">${Icon.x(16)}</button></div><div class="modal-body"><form data-form="report"><div class="form-group"><label class="form-label">Reason</label><select class="form-select" name="reason" required><option value="">Select a reason...</option><option>Suspicious or scam listing</option><option>Inappropriate content</option><option>Inappropriate behaviour</option><option>Incorrect information</option><option>Spam</option><option>Other</option></select></div><div class="form-group"><label class="form-label">Description (optional)</label><textarea class="form-textarea" name="description" rows="3"></textarea></div></form></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-brand" id="report-submit">${Icon.send(14)} Submit report</button></div></div>`);
  document.getElementById('report-submit').onclick = async () => {
    const form = document.querySelector('[data-form="report"]');
    if (!form.reason.value) { toast('Reason required', 'Please choose a reason.', 'error'); return; }
    await DB.createReport({ reporterId: user.id, targetType, targetId, reason: form.reason.value, description: form.description.value.trim() });
    closeModal(); toast('Report submitted', 'An administrator will review your report.', 'success');
  };
}

function openPreviewModal(jobData) {

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) {
    document.querySelectorAll('.profile-menu .dropdown, .notif-panel').forEach(el => {
      if (!e.target.closest('.profile-menu') && !e.target.closest('[data-action="toggle-notifications"]')) el.remove();
    });
    return;
  }
  const action = t.dataset.action;
  const id = t.dataset.id;
  const user = DB.currentUser();

  try { switch (action) {
    case 'go': {
      const view = t.dataset.view;
      const params = {};
      if (t.dataset.param) { try { Object.assign(params, JSON.parse(t.dataset.param)); } catch {} }
      Router.go(view, params);
      document.getElementById('mobile-menu').classList.remove('open');
      break;
    }
    case 'go-home': Router.go('landing'); break;
    case 'go-back': Router.go('dashboard'); break;
    case 'logout':
      confirmDialog('Sign out', 'Are you sure you want to sign out?', () => { Auth.logout(); toast('Signed out', 'You have been signed out.', 'info'); Router.go('landing'); });
      break;
    case 'view-job': Router.go('job-detail', { id }); break;
    case 'view-employer': Router.go('employer-profile', { id }); break;
    case 'view-profile': Router.go('profile', { id }); break;
    case 'view-application': Router.go('application-detail', { id }); break;
    case 'toggle-save-job': {
      if (!user) { Router.go('login'); return; }
      if (DB.isJobSaved(user.id, id)) { await DB.unsaveJob(user.id, id); toast('Removed', 'Job removed from saved list.', 'info'); }
      else { await DB.saveJob(user.id, id); toast('Saved', 'Job added to your saved list.', 'success'); }
      Router.render();
      break;
    }
    case 'apply-job': openApplyModal(id); break;
    case 'withdraw-application':
      confirmDialog('Withdraw application', 'Are you sure you want to withdraw this application?', async () => { await Live.change('/api/applications/'+id+'/withdraw','PATCH'); toast('Application withdrawn', 'The employer has been notified.', 'info'); Router.render(); });
      break;
    case 'update-app-status': {
      const status = t.dataset.status;
      const app = DB.getApplicationById(id);
      if (!app) return;
      await DB.updateApplicationStatus(id, status);
      const job = DB.getJobById(app.jobId);
      DB.createNotification({ userId: app.jobSeekerId, title: 'Application update', message: `Your application for ${job ? job.title : 'a job'} is now ${status}.`, type: 'application', relatedEntityId: id, relatedEntityType: 'application' });
      toast('Status updated', `Application marked as ${status}.`, 'success');
      Router.render();
      break;
    }
    case 'edit-job': Router.go('edit-job', { id }); break;
    case 'close-job':
      confirmDialog('Close listing', 'This will stop accepting new applications. You can reopen it later.', async () => { await DB.updateJob(id, { status: 'closed' }); toast('Listing closed', 'The job is no longer visible to seekers.', 'info'); Router.render(); }, 'Close listing');
      break;
    case 'reopen-job':
      await DB.updateJob(id, { status: 'active' }); toast('Listing reopened', 'The job is visible again.', 'success'); Router.render();
      break;
    case 'delete-job':
      confirmDialog('Delete listing', 'This will permanently remove the listing and all its applications. This cannot be undone.', async () => { await DB.deleteJob(id); toast('Listing deleted', 'The job has been removed.', 'info'); Router.render(); }, 'Delete', true);
      break;
    case 'admin-remove-job':
      confirmDialog('Close listing', 'Close this listing as an administrator?', async () => { try { await Live.change('/api/admin/jobs/'+id+'/status?status=closed','PATCH');toast('Listing closed','','success');Router.render(); } catch(e){toast('Failed',e.message,'error');} }, 'Close', true);
      break;
    case 'view-applicants-for-job': Router.go('applicant-management'); break;
    case 'message-user': {
      if (!user) { Router.go('login'); return; }
      const jobId = t.dataset.job;
      const conv = await DB.getOrCreateConversation(user.id, id, jobId || null);
      activeConversationId = conv.id;
      Router.go('messages');
      break;
    }
    case 'open-conversation': activeConversationId = id; Router.render(); break;
    case 'report-user': openReportModal('user', id); break;
    case 'report-employer': openReportModal('employer', id); break;
    case 'review-employer': openReviewModal(id, t.dataset.job); break;
    case 'resolve-report': await DB.updateReportStatus(id, 'Resolved'); toast('Report resolved', '', 'success'); Router.render(); break;
    case 'dismiss-report': await DB.updateReportStatus(id, 'Dismissed'); toast('Report dismissed', '', 'info'); Router.render(); break;
    case 'suspend-user':
      confirmDialog('Suspend account', 'Suspend this user account? They will not be able to sign in.', async () => { await DB.updateUser(id, { status: 'suspended' }); toast('Account suspended', '', 'info'); Router.render(); }, 'Suspend', true);
      break;
    case 'reactivate-user':
      await DB.updateUser(id, { status: 'active' }); toast('Account reactivated', '', 'success'); Router.render();
      break;
    case 'toggle-profile-menu': {
      document.querySelectorAll('.notif-panel').forEach(n => n.remove());
      const menu = t.parentNode.querySelector('.dropdown');
      if (menu) { menu.remove(); return; }
      const d = document.createElement('div');
      d.className = 'dropdown';
      d.innerHTML = `<div class="dropdown-header">Signed in as</div><div style="padding:10px 12px"><div class="text-strong">${Utils.escape(user.firstName + ' ' + user.lastName)}</div><div class="text-xs text-muted">${Utils.escape(user.email)}</div></div><div class="dropdown-divider"></div><button class="dropdown-item" data-action="go" data-view="${user.role==='employer'?'employer-profile':'profile'}">${Icon.user()} View profile</button><button class="dropdown-item" data-action="go" data-view="edit-profile">${Icon.edit()} Edit profile</button><button class="dropdown-item" data-action="go" data-view="settings">${Icon.settings()} Settings</button><div class="dropdown-divider"></div><button class="dropdown-item danger" data-action="logout">${Icon.logout()} Sign out</button>`;
      t.parentNode.appendChild(d);
      break;
    }
    case 'toggle-notifications': {
      document.querySelectorAll('.profile-menu .dropdown').forEach(n => n.remove());
      const existing = document.querySelector('.notif-panel');
      if (existing) { existing.remove(); return; }
      const notifs = DB.getNotifications(user.id).slice(0, 8);
      const panel = document.createElement('div');
      panel.className = 'notif-panel';
      panel.innerHTML = `<div class="notif-head"><h4>Notifications</h4><button class="btn btn-ghost btn-sm" data-action="mark-all-read">Mark all read</button></div>${notifs.length ? notifs.map(n => `<div class="notif-item ${n.read?'':'unread'}" data-action="open-notification" data-id="${n.id}"><div class="notif-icon ${n.type === 'application' ? 'brand' : 'teal'}">${n.type === 'application' ? Icon.file(18) : n.type === 'message' ? Icon.message(18) : Icon.bell(18)}</div><div class="notif-content"><div class="notif-title">${Utils.escape(n.title)}</div><div class="notif-msg">${Utils.escape(Utils.truncate(n.message, 80))}</div><div class="notif-time">${Utils.formatDateTime(n.createdAt)}</div></div></div>`).join('') : `<div class="empty-state" style="padding:30px"><p>No notifications</p></div>`}<div style="padding:12px;text-align:center;border-top:1px solid var(--line)"><button class="btn btn-ghost btn-sm" data-action="go" data-view="notifications">View all</button></div>`;
      t.parentNode.appendChild(panel);
      break;
    }
    case 'open-notification': {
      const n = DB.load().notifications.find(x => x.id === id);
      if (n) { await DB.markNotificationRead(id); }
      document.querySelectorAll('.notif-panel').forEach(p => p.remove());
      if (n && n.relatedEntityType === 'application') Router.go('application-detail', { id: n.relatedEntityId });
      else if (n && n.relatedEntityType === 'job') Router.go('job-detail', { id: n.relatedEntityId });
      else Router.go('notifications');
      break;
    }
    case 'mark-all-read':
      if (user) await DB.markAllNotificationsRead(user.id);
      document.querySelectorAll('.notif-panel').forEach(p => p.remove());
      toast('All marked as read', '', 'info');
      renderTopNav();
      if (Router.current === 'notifications') Router.render();
      break;
    case 'search-category': jobFilters.category = t.dataset.category; Router.go('find-jobs'); break;
    case 'clear-filters':
      Object.keys(jobFilters).forEach(k => { if (typeof jobFilters[k] === 'boolean') jobFilters[k] = false; else jobFilters[k] = ''; });
      jobFilters.sort = 'newest';
      Router.render();
      break;
    case 'preview-job': {
      const form = document.querySelector('[data-form="job"]');
      if (!form) return;
      openPreviewModal({ title: form.title.value, category: form.category.value, employmentType: form.employmentType.value, location: form.location.value, salaryAmount: Number(form.salaryAmount.value), salaryFrequency: form.salaryFrequency.value, description: form.description.value, skills: form.skills.value.split(',').map(s => s.trim()).filter(Boolean), qualificationRequirements: form.qualificationRequirements.value, experienceRequirements: form.experienceRequirements.value, positions: Number(form.positions.value), deadline: form.deadline.value });
      break;
    }
    case 'reset-demo': toast('Unavailable','Live database cannot be reset from the browser.','info'); break;
  } } catch(err){console.error(err);toast('Request failed',err.message,'error');}
});

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form');
  if (!form) return;
  const name = form.dataset.form;
  try { if (name === 'login') {
    e.preventDefault();
    const email = form.email.value.trim();
    const password = form.password.value;
    form.querySelectorAll('.form-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
    if (!email || !password) { const g = form.querySelector('[data-error="general"]'); g.textContent = 'Please enter your email and password.'; g.classList.add('show'); return; }
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Signing in...';
    (async () => {
      const res = await Auth.login(email, password);
      if (!res.ok) { const g = form.querySelector('[data-error="general"]'); g.textContent = res.error; g.classList.add('show'); btn.disabled = false; btn.textContent = 'Sign in'; return; }
      toast('Welcome back', `Signed in as ${res.user.firstName}.`, 'success');
      Router.go('dashboard');
    })();
  }
  if (name === 'register') {
    e.preventDefault();
    form.querySelectorAll('.form-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
    const data = { firstName: form.firstName.value.trim(), lastName: form.lastName.value.trim(), email: form.email.value.trim(), phone: form.phone.value.trim(), location: form.location.value.trim(), role: form.role.value, password: form.password.value, confirmPassword: form.confirmPassword.value, acceptTerms: form.acceptTerms.checked };
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Creating account...';
    (async () => {
      const res = await Auth.register(data);
      if (!res.ok) { const g = form.querySelector('[data-error="general"]'); g.textContent = res.error; g.classList.add('show'); btn.disabled = false; btn.textContent = 'Create account'; return; }
      toast('Account created', `Welcome to UrbanMatch, ${res.user.firstName}!`, 'success');
      Router.go('dashboard');
    })();
  }
  if (name === 'job') {
    e.preventDefault();
    const user = DB.currentUser();
    if (!user || user.role !== 'employer') return;
    const data = { title: form.title.value.trim(), category: form.category.value, employmentType: form.employmentType.value, location: form.location.value.trim(), salaryAmount: Number(form.salaryAmount.value), salaryFrequency: form.salaryFrequency.value, description: form.description.value.trim(), skills: form.skills.value.split(',').map(s => s.trim()).filter(Boolean), qualificationRequirements: form.qualificationRequirements.value.trim(), experienceRequirements: form.experienceRequirements.value.trim(), positions: Number(form.positions.value) || 1, deadline: form.deadline.value, contactPreferences: form.contactPreferences.value.trim() };
    if (!data.title || !data.category || !data.location || !data.description || !data.salaryAmount) { toast('Missing fields', 'Please complete all required fields.', 'error'); return; }
    if (Router.params.id) { await DB.updateJob(Router.params.id, data); toast('Listing updated', 'Your changes have been saved.', 'success'); }
    else { await DB.createJob({ ...data, employerId: user.id }); toast('Job published', 'Your listing is now live.', 'success'); }
    Router.go('manage-listings');
  }
  if (name === 'edit-profile') {
    e.preventDefault();
    const user = DB.currentUser();
    if (!user) return;
    const data = { firstName: form.firstName.value.trim(), lastName: form.lastName.value.trim(), email: form.email.value.trim(), phone: form.phone.value.trim(), location: form.location.value.trim() };
    if (user.role === 'employer') { data.companyName = form.companyName.value.trim(); data.industry = form.industry.value.trim(); data.companyDescription = form.companyDescription.value.trim(); }
    else { data.headline = form.headline.value.trim(); data.bio = form.bio.value.trim(); data.skills = form.skills.value.split(',').map(s => s.trim()).filter(Boolean); data.availability = form.availability.value; }
    await DB.updateUser(user.id, data);
    if(user.role==='employer')await Live.change('/api/employer/profile','PUT',{companyName:data.companyName,industry:data.industry,companyDescription:data.companyDescription});
    toast('Profile updated', 'Your changes have been saved.', 'success');
    Router.go(user.role === 'employer' ? 'employer-profile' : 'profile');
  }
  if (name === 'send-message') {
    e.preventDefault();
    const user = DB.currentUser();
    if (!user || !activeConversationId) return;
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    const conv = DB.load().conversations.find(c => c.id === activeConversationId);
    if (!conv) return;
    const receiverId = conv.participantIds.find(p => p !== user.id);
    await DB.sendMessage({ conversationId: activeConversationId, senderId: user.id, receiverId, messageText: text });
    DB.createNotification({ userId: receiverId, title: 'New message', message: `${user.firstName} ${user.lastName} sent you a message.`, type: 'message', relatedEntityId: activeConversationId, relatedEntityType: 'conversation' });
    input.value = '';
    const thread = document.getElementById('msg-thread');
    if (thread) thread.innerHTML = threadHTML(activeConversationId, user.id);
    const body = document.getElementById('msg-body');
    if (body) body.scrollTop = body.scrollHeight;
    const list = document.getElementById('conv-list');
    if (list) { const convs = DB.getConversations(user.id); list.innerHTML = convs.map(c => convItemHTML(c, user.id)).join(''); }
  }
  if (name === 'hero-search') {
    e.preventDefault();
    jobFilters.q = form.q.value.trim();
    Router.go('find-jobs');
  } } catch(err){console.error(err);toast('Request failed',err.message,'error');}
});

document.addEventListener('input', Utils.debounce((e) => {
  const t = e.target;
  if (t.id === 'filter-location') { jobFilters.location = t.value; Router.render(); }
  if (t.id === 'filter-minpay') { jobFilters.minPay = t.value; Router.render(); }
  if (t.id === 'filter-maxpay') { jobFilters.maxPay = t.value; Router.render(); }
  if (t.id === 'topnav-search') { jobFilters.q = t.value; if (Router.current !== 'find-jobs') Router.go('find-jobs'); else Router.render(); }
  if (t.id === 'conv-search') {
    const q = t.value.toLowerCase();
    const user = DB.currentUser();
    if (!user) return;
    const convs = DB.getConversations(user.id).filter(c => { const other = DB.getUserById(c.participantIds.find(p => p !== user.id)); return other && (other.firstName + ' ' + other.lastName).toLowerCase().includes(q); });
    const list = document.getElementById('conv-list');
    if (list) list.innerHTML = convs.length ? convs.map(c => convItemHTML(c, user.id)).join('') : `<div class="empty-state" style="padding:30px 20px"><p>No matches</p></div>`;
  }
  if (t.id === 'admin-user-search') {
    const q = t.value.toLowerCase();
    const users = DB.getUsers().filter(u => (u.firstName + ' ' + u.lastName + ' ' + u.email).toLowerCase().includes(q));
    const table = document.getElementById('admin-users-table');
    if (table) table.innerHTML = adminUsersTableHTML(users);
  }
}, 220));

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'filter-category') { jobFilters.category = t.value; Router.render(); }
  if (t.id === 'filter-sort') { jobFilters.sort = t.value; Router.render(); }
  if (t.id === 'filter-noquals') { jobFilters.noQuals = t.checked; Router.render(); }
  if (t.id === 'filter-newonly') { jobFilters.newOnly = t.checked; Router.render(); }
  if (t.name === 'filter-type') { jobFilters.employmentType = t.value; Router.render(); }
  if (t.id === 'profile-pic') {
    const file = t.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('File too large', 'Please choose an image under 2MB.', 'error'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const user = DB.currentUser();
      if (!user) return;
      const field = user.role === 'employer' ? 'companyLogo' : 'profilePicture';
      DB.updateUser(user.id, { [field]: ev.target.result });
      toast('Photo updated', '', 'success');
      Router.render();
    };
    reader.readAsDataURL(file);
  }
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action="toggle-password"]');
  if (!t) return;
  const input = document.getElementById(t.dataset.target);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  t.textContent = input.type === 'password' ? 'Show' : 'Hide';
});

document.addEventListener('click', (e) => {
  if (e.target.matches('[data-action="close-modal"], [data-action="close-modal-bg"]')) {
    if (e.target.matches('[data-action="close-modal-bg"]') && !e.target.classList.contains('modal-backdrop')) return;
    closeModal();
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.getElementById('mobile-toggle').addEventListener('click', () => { document.getElementById('mobile-menu').classList.toggle('open'); });

Live.start();
window.UrbanMatch = { DB, Router, Auth, Utils, Icon, Img };
</script>
</body>
